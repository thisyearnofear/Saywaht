[build]
  # Install dependencies at root and build the Next.js app
  command = "cd ../.. && npm install --omit=optional && cd apps/web && npm run build"

  # Publish directory (Next.js build output)
  publish = ".next"

  # Base directory for the build (apps/web)
  base = "apps/web"

[build.environment]
   # Node.js version - Must be 22+ for @zoralabs/coins-sdk compatibility
   NODE_VERSION = "22"

  # Disable telemetry and platform-specific downloads
  NEXT_TELEMETRY_DISABLED = "1"
  DISABLE_OPENCOLLECTIVE = "1"

  # Force Next.js to skip platform-specific SWC downloads
  NEXT_SKIP_NATIVE_POSTINSTALL = "1"
  __NEXT_SWCMINIFY = "false"

  # NPM configuration to avoid optional dependencies
  npm_config_optional = "false"
  npm_config_fund = "false"
  npm_config_audit = "false"

# Secrets scanning configuration
[build.processing.secrets]
  # Omit .env.example files from secrets scanning
  omit_paths = [".env.example"]

# Correct MIME types for Next.js static assets
[[headers]]
  for = "/_next/static/css/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/_next/static/js/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Next.js on Netlify requires the Essential Next.js plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"
