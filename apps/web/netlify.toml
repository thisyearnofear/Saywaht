[build]
  # Install dependencies at root and build the Next.js app
  command = "cd ../.. && bun install && cd apps/web && bun run build"
  
  # Publish directory (Next.js build output)
  publish = ".next"
  
  # Base directory for the build (apps/web)
  base = "apps/web"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"
  
  # Bun version
  BUN_VERSION = "1.2.17"

# Next.js on Netlify requires the Essential Next.js plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"