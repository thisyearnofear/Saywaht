# Netlify configuration for Next.js (via @netlify/plugin-nextjs)
# The plugin handles SSR, correct MIME types for _next/static assets,
# and routing — no manual redirects or Content-Type headers needed.
[build]
  command = "cd ../.. && npm install --omit=optional && cd apps/web && npm run build"
  publish = ".next"
  base = "apps/web"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  DISABLE_OPENCOLLECTIVE = "1"
  NEXT_SKIP_NATIVE_POSTINSTALL = "1"
  __NEXT_SWCMINIFY = "false"
  npm_config_optional = "false"
  npm_config_fund = "false"
  npm_config_audit = "false"

[build.processing.secrets]
  omit_paths = [".env.example"]

# Long-lived cache for immutable hashed Next.js static assets.
# MIME types are set correctly by the plugin so these headers
# only need to add caching — no Content-Type override required.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[plugins]]
  package = "@netlify/plugin-nextjs"
