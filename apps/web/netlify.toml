# Standard Netlify Next.js configuration
[build]
  command = "cd ../.. && npm install --omit=optional && cd apps/web && npm run build"
  publish = ".next"
  base = "apps/web"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  DISABLE_OPENCOLLECTIVE = "1"
  NEXT_SKIP_NATIVE_POSTINSTALL = "1"
  __NEXT_SWCMINIFY = "false"
  npm_config_optional = "false"
  npm_config_fund = "false"
  npm_config_audit = "false"

[build.processing.secrets]
  omit_paths = [".env.example"]

# Explicit redirects to prevent 404s for static assets showing as text/plain
[[redirects]]
  from = "/_next/static/*"
  to = "/_next/static/:splat"
  status = 200
  force = true

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Ensure CSS is served with correct MIME type
[[headers]]
  for = "/_next/static/css/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

# Ensure JS is served with correct MIME type
[[headers]]
  for = "/_next/static/chunks/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[plugins]]
  package = "@netlify/plugin-nextjs"
